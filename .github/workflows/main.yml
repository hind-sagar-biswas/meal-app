on:
  push:
    branches: ["main", "UI_CHANGES"]
    paths:
      - "server/**"

name: 🚀 Server CI/CD

jobs:
  test:
    name: 🧪 Run Pest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, sqlite3
          tools: composer

      - name: ⬆️ Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 📋 Copy test .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: 🔑 Generate App Key
        run: php artisan key:generate

      - name: 🧪 Run Pest
        run: ./vendor/bin/pest

  web-deploy:
    name: 🎉 Deploy
    needs: test 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Use BunJS
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: ⬆️ Composer Install
        run: composer install --no-dev --optimize-autoloader

      - name: 📋 Copy .env
        run: php -r "file_exists('.env') || copy('.env.prod', '.env');"

      - name: 🔒 Inject Secrets into .env
        run: |
          sed -i 's/__APP_URL__/${{ secrets.APP_URL }}/g' .env
          sed -i 's/__DB_DATABASE__/${{ secrets.DB_DATABASE }}/g' .env
          sed -i 's/__DB_USERNAME__/${{ secrets.DB_USERNAME }}/g' .env
          sed -i 's/__DB_PASSWORD__/${{ secrets.DB_PASSWORD }}/g' .env

      - name: 🔑 Generate App Key
        run: php artisan key:generate

      - name: Link Storage
        run: php artisan storage:link

      - name: 🔑 Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: ⬇️ Install Bun
        run: bun install

      - name: 🏗️ Build JS and CSS
        run: bun run build

      - name: 🗑️ Remove vendor folder
        run: rm -rf vendor

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./server/
